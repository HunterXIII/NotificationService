services:
  notification-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: devforge
      POSTGRES_PASSWORD: devforge
      POSTGRES_DB: notification_db
    volumes:
      - notification_pg_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devforge -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [devforge]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: devforge
      RABBITMQ_DEFAULT_PASS: devforge
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [devforge]

  notification-service:
    build: 
      context: .
      dockerfile: service.Dockerfile
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DB_HOST: notification-db
      POSTGRES_USER: devforge
      POSTGRES_PASSWORD: devforge
      POSTGRES_NAME: notification_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: devforge
      RABBITMQ_PASSWORD: devforge
      GOOGLE_KEY: ${GOOGLE_KEY:-}
    ports:
      - "8005:8000"
    depends_on:
      notification-db:
        condition: service_healthy
    networks: [devforge]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - notification-service
      - notification-worker
    networks: [devforge]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [devforge]

  notification-worker:
    build: 
      context: .
      dockerfile: worker.Dockerfile
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "alembic upgrade head && python worker.py"
    environment:
      DB_HOST: notification-db
      POSTGRES_USER: devforge
      POSTGRES_PASSWORD: devforge
      POSTGRES_NAME: notification_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: devforge
      RABBITMQ_PASSWORD: devforge
      GOOGLE_KEY: ${GOOGLE_KEY:-}
      WORKER_METRICS_PORT: 9108
    expose:
      - "9108"
    depends_on:
      rabbitmq:
        condition: service_healthy
      notification-db:
        condition: service_healthy
    networks: [devforge]

networks:
  devforge:
    name: devforge

volumes:
  notification_pg_data:
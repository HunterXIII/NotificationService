name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: devforge
          RABBITMQ_DEFAULT_PASS: devforge

    env:
      DB_HOST: localhost
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_NAME: test
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_USER: devforge
      RABBITMQ_PASSWORD: devforge

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Wait for RabbitMQ
        run: |
          for _ in $(seq 1 30); do
            if bash -c "echo > /dev/tcp/127.0.0.1/5672" 2>/dev/null; then
              echo "RabbitMQ is up"
              exit 0
            fi
            sleep 1
          done
          echo "RabbitMQ did not become ready in time"
          exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v --tb=short

  publish-images:
    needs: test
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names and tags
        id: tags
        env:
          REPOSITORY_LC: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo_lc=$(echo "$REPOSITORY_LC" | tr '[:upper:]' '[:lower:]')
          # ghcr.io/<логин>/<репозиторий>:latest и :<полный_sha>
          echo "service_tags=ghcr.io/${repo_lc}:latest,ghcr.io/${repo_lc}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "worker_tags=ghcr.io/${repo_lc}-worker:latest,ghcr.io/${repo_lc}-worker:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.service_tags }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.worker_tags }}

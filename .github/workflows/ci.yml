name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: devforge
          RABBITMQ_DEFAULT_PASS: devforge

    env:
      DB_HOST: localhost
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_NAME: test
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_USER: devforge
      RABBITMQ_PASSWORD: devforge

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Wait for RabbitMQ
        run: |
          for _ in $(seq 1 30); do
            if bash -c "echo > /dev/tcp/127.0.0.1/5672" 2>/dev/null; then
              echo "RabbitMQ is up"
              exit 0
            fi
            sleep 1
          done
          echo "RabbitMQ did not become ready in time"
          exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v --tb=short

  publish-images:
    needs: test
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          set -euo pipefail
          owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          sha_short=$(echo '${{ github.sha }}' | cut -c1-7)
          ref='${{ github.ref }}'
          if [[ "$ref" == "refs/heads/main" || "$ref" == "refs/heads/master" ]]; then
            echo "service_tags=ghcr.io/${owner_lc}/notifications-service:latest,ghcr.io/${owner_lc}/notifications-service:sha-${sha_short}" >> "$GITHUB_OUTPUT"
            echo "worker_tags=ghcr.io/${owner_lc}/notifications-worker:latest,ghcr.io/${owner_lc}/notifications-worker:sha-${sha_short}" >> "$GITHUB_OUTPUT"
          else
            git_tag="${ref#refs/tags/}"
            echo "service_tags=ghcr.io/${owner_lc}/notifications-service:latest,ghcr.io/${owner_lc}/notifications-service:${git_tag}" >> "$GITHUB_OUTPUT"
            echo "worker_tags=ghcr.io/${owner_lc}/notifications-worker:latest,ghcr.io/${owner_lc}/notifications-worker:${git_tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.service_tags }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.worker_tags }}
